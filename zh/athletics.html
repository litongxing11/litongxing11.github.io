      <p class="eyebrow">体育 / 羽毛球</p>
      <h1 id="athletics-title">另一种<br>解决问题的方式。</h1>
      <p class="athletics-lead">脚步敏捷，头脑清晰，专注每一个回合。</p>
      <p>羽毛球是我课堂之外的一项爱好。球场上，每一次对打都带来新的挑战：判断来球、寻找空当，并为下一拍做好准备。</p>
    </section>
    <section class="athletics-gallery" aria-labelledby="gallery-title">
      <div class="gallery-heading"><p class="eyebrow">石溪中学球场上</p><h2 id="gallery-title">比赛中的瞬间。</h2></div>
      <figure>
        <a class="photo-link" href="../assets/documents/DSC02495.jpg" target="_blank" rel="noopener" aria-label="查看完整对打照片（在新标签页中打开）"><img src="../assets/photos/badminton-rally.jpg" width="1200" height="1800" alt="Tony 举起球拍、目光追随羽毛球，在球场上移动" decoding="async"></a>
        <figcaption><span class="eyebrow">01 / 对打之中</span><h3>抬头观察，随时准备。</h3><p>手握球拍追踪来球，移动到位，准备下一次回击。对打是在预判与反应之间持续进行的对话。</p></figcaption>
      </figure>
      <figure>
        <a class="photo-link" href="../assets/documents/DSC02515.jpg" target="_blank" rel="noopener" aria-label="查看完整发球照片（在新标签页中打开）"><img src="../assets/photos/badminton-serve.jpg" width="1200" height="1800" alt="Tony 在学校体育馆里手持羽毛球和球拍，准备发球" loading="lazy" decoding="async"></a>
        <figcaption><span class="eyebrow">02 / 发球之前</span><h3>专注的一刻。</h3><p>一手持球，一手握拍：比赛开始前短暂的停顿。发球开启回合，也让准备与速度一样成为比赛的重要部分。</p></figcaption>
      </figure>
    </section>
